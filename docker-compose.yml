version: '3.8'

services:
  # PostgreSQL database for authentication
  postgres:
    image: postgres:16-alpine
    container_name: esg-postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esg-network

  # RAG Service (Vector search and LLM orchestration)
  rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: esg-rag-service
    restart: always
    env_file:
      - .env
    environment:
      - RAG_API_BASE_URL=http://rag:8000
    volumes:
      - rag_data:/app/RAG_SYSTEM/data
      - rag_storage:/app/RAG_SYSTEM/storage
    ports:
      - "8000:8000"
    networks:
      - esg-network

  # Orchestration Backend (Auth, News, Recommendations)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: esg-backend
    restart: always
    env_file:
      - .env
    environment:
      - RAG_API_BASE_URL=http://rag:8000
      - DATABASE_URL=postgresql://esg_user:esg_password@postgres:5432/esg_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      rag:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "5050:5050"
    networks:
      - esg-network

  # Frontend (Vite/React served by Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: esg-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - esg-network

volumes:
  postgres_data:
  rag_data:
  rag_storage:

networks:
  esg-network:
    driver: bridge
